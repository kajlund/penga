<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penga - Personal Finance Manager</title>
    
    <!-- Theme Early Bootstrapper: prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('penga-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Typography: Inter & JetBrains Mono for tabular ledger values -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Global Theme Tokens -->
    <link rel="stylesheet" href="/src/styles/theme.css" />
  </head>
  <body>
    <penga-app></penga-app>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
