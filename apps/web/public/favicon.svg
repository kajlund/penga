<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Emerald Primary Theme -->
    <linearGradient id="penga-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle Top-Left Ambient Glow -->
    <radialGradient id="penga-glow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Glyph Drop Shadow for depth -->
    <filter id="penga-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#penga-bg)" />

  <!-- Ambient Light Reflection -->
  <rect width="512" height="512" rx="120" fill="url(#penga-glow)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" />

  <!-- Geometric "P" Emblem -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    filter="url(#penga-shadow)"
    d="M 140,132
       A 28,28 0 0,1 168,104
       H 276
       A 100,100 0 0,1 376,204
       A 100,100 0 0,1 276,304
       H 204
       V 380
       A 28,28 0 0,1 176,408
       H 168
       A 28,28 0 0,1 140,380
       Z
       M 204,168
       H 276
       A 36,36 0 0,1 312,204
       A 36,36 0 0,1 276,240
       H 204
       Z"
  />
</svg>
